<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <style>
        * {
            background: #a9bcb6;
            color: white;
            top: 100%;
            margin-top: 20px;
        }
        .h1 {
            margin-bottom: 0px;
            margin-top: 200px;
            color: rgb(10, 108, 135);
        }

        .container {
            text-align: center;
            margin-top: 40px;
        }

        .text {
            padding-left: 15px;
            border-radius: 20px;
            width: 50%;
            border: none;
            background-color: white;
            font-size: 20px;
            padding-top: 10px;
            padding-bottom: 10px;
            margin-right: 8px;
            cursor: pointer;
            color:#747776;
            font-weight: 600;
            font-family:calibri;
        }

        .text:hover {
            background-color: white;
            box-shadow: 0 0 20px rgb(247, 243, 243);
            border-radius: 10px;
            padding-left: 10px;
            padding-right: 10px;
            color:#747776;
            border: none;
            font-size: 20px;
            
            
            
        }

        .button {
            border-radius: 20px;
            box-shadow: 0 0 20px rgb(247, 243, 243);
            background-color:white;
            margin-left: 2px;
            border: none;
            font-size: 18px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            font: calibri;
            font-weight: 600;
            color: #747776;
            cursor: pointer;
        }

        .button:hover {
            background-color: white;
            box-shadow: 0 0 10px rgb(247, 243, 243);
            border-radius: 10px;
            padding-left: 22px;
            padding-right: 22px;
            font-size: 19px;
        }

        .result {
            color: rgb(255, 255, 255);
            margin-top: 28px;
            font-size: 25px;
            font-weight: bold;
            margin-left: 0px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 class="h1">Sentiment Analysis</h1>
        <form method="POST">
            <input type="text" class="text" name="text" placeholder="Enter your feed back....."  required>
            <button class="button" type="submit">Submit</button>
        </form>

        {% if sentiment %}
        <div class="result">
            Sentiment :  {{ sentiment }}
        </div>
        {% else %}
        <div class="result">
            Please enter your feed back to analyze sentiment... 
        </div>
        {% endif %} 

    </div>

</body>

</html>
